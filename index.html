<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf8f6">
<title>Body Shape Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: #faf8f6;
  color: #444;
}

header {
  background: #fff;
  padding: 22px 16px;
  text-align: center;
  border-bottom: 1px solid #eee;
}

header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
}

header p {
  margin: 7px 0 0;
  color: #999;
  font-size: 12px;
}

.container {
  width: min(720px, 92%);
  margin: 20px auto 60px;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 18px rgba(80,60,50,.06);
}

.card h2 {
  font-size: 18px;
  margin: 0 0 18px;
}

.date {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  background: #fff;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 16px;
}

.input-group label {
  display: block;
  font-size: 12px;
  color: #777;
  margin-bottom: 6px;
}

.input-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.input-group input {
  width: 100%;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
}

.input-group input:focus {
  border-color: #cda99a;
}

.unit {
  font-size: 12px;
  color: #999;
}

.save-button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  margin-top: 18px;
  background: #9b7768;
  color: white;
  font-size: 15px;
  font-weight: 600;
}

.save-button:active {
  transform: scale(.98);
}

.message {
  text-align: center;
  font-size: 13px;
  color: #9b7768;
  margin-top: 10px;
  min-height: 18px;
}

/* =========================
   REALISTIC BODY
========================= */

.body-area {
  min-height: 510px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
}

.body-svg {
  width: 300px;
  height: 500px;
  overflow: visible;
}

.skin {
  fill: #e5ad91;
  stroke: #9b6a57;
  stroke-width: 1.15;
  stroke-linejoin: round;
}

.skin-light {
  fill: #edc0a8;
  opacity: .55;
}

.shadow {
  fill: #a96851;
  opacity: .16;
}

.body-detail {
  fill: none;
  stroke: #a56f5b;
  stroke-width: 1.1;
  opacity: .25;
}

.body-info {
  text-align: center;
  font-size: 12px;
  color: #aaa;
  margin-top: -8px;
}

/* =========================
   GRAPH
========================= */

.select-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.select-row select {
  flex: 1;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 9px;
  background: white;
}

.graph-wrap {
  position: relative;
  width: 100%;
  height: 280px;
}

#graph {
  width: 100%;
  height: 100%;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.history-item:last-child {
  border-bottom: none;
}

.history-date {
  font-weight: 600;
  font-size: 14px;
}

.history-values {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

.delete-btn {
  border: none;
  background: #f4eeee;
  color: #9b7768;
  border-radius: 8px;
  padding: 7px 10px;
}

.empty {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  padding: 25px 0;
}

@media (max-width: 500px) {
  .grid {
    grid-template-columns: 1fr 1fr;
  }

  .body-svg {
    width: 280px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Body Shape Tracker</h1>
  <p>体型の変化を記録しよう</p>
</header>

<div class="container">

  <!-- 入力 -->
  <section class="card">
    <h2>体型を記録</h2>

    <input
      type="date"
      id="date"
      class="date"
    >

    <div class="grid">

      <div class="input-group">
        <label>身長</label>
        <div class="input-wrap">
          <input type="number" id="height" step="0.1">
          <span class="unit">cm</span>
        </div>
      </div>

      <div class="input-group">
        <label>体重</label>
        <div class="input-wrap">
          <input type="number" id="weight" step="0.1">
          <span class="unit">kg</span>
        </div>
      </div>

      <div class="input-group">
        <label>バスト</label>
        <div class="input-wrap">
          <input type="number" id="bust" step="0.1">
          <span class="unit">cm</span>
        </div>
      </div>

      <div class="input-group">
        <label>ウエスト</label>
        <div class="input-wrap">
          <input type="number" id="waist" step="0.1">
          <span class="unit">cm</span>
        </div>
      </div>

      <div class="input-group">
        <label>ヒップ</label>
        <div class="input-wrap">
          <input type="number" id="hip" step="0.1">
          <span class="unit">cm</span>
        </div>
      </div>

      <div class="input-group">
        <label>太もも</label>
        <div class="input-wrap">
          <input type="number" id="thigh" step="0.1">
          <span class="unit">cm</span>
        </div>
      </div>

      <div class="input-group">
        <label>ふくらはぎ</label>
        <div class="input-wrap">
          <input type="number" id="calf" step="0.1">
          <span class="unit">cm</span>
        </div>
      </div>

      <div class="input-group">
        <label>足首</label>
        <div class="input-wrap">
          <input type="number" id="ankle" step="0.1">
          <span class="unit">cm</span>
        </div>
      </div>

      <div class="input-group">
        <label>二の腕</label>
        <div class="input-wrap">
          <input type="number" id="arm" step="0.1">
          <span class="unit">cm</span>
        </div>
      </div>

    </div>

    <button class="save-button" onclick="saveRecord()">
      この日の体型を保存
    </button>

    <div class="message" id="message"></div>
  </section>


  <!-- 人体 -->
  <section class="card">

    <h2>現在の体型</h2>

    <div class="body-area">

      <svg
        class="body-svg"
        viewBox="0 0 300 500"
        id="bodySvg"
        aria-label="体型シルエット"
      >

        <!-- 頭 -->
        <ellipse
          id="head"
          class="skin"
          cx="150"
          cy="42"
          rx="25"
          ry="31"
        />

        <!-- 首 -->
        <path
          id="neck"
          class="skin"
          d="
            M137 65
            C137 74 137 81 133 88
            C139 92 161 92 167 88
            C163 81 163 74 163 65
            Z
          "
        />

        <!-- 胴体 -->
    
        <path
          id="torso"
          class="skin"
          d="
            M 108 88
            C 100 96 96 112 98 128
            C 100 142 108 153 112 166
            C 114 178 112 190 109 202
            C 106 216 110 232 120 246
            C 126 256 132 267 134 280
            L 166 280
            C 168 267 174 256 180 246
            C 190 232 194 216 191 202
            C 188 190 186 178 188 166
            C 192 153 200 142 202 128
            C 204 112 200 96 192 88
            C 180 82 168 80 150 82
            C 132 80 120 82 108 88
  　　　　　  Z
          "
        />

        <!-- 左腕 -->
        <path
          id="leftArm"
          class="skin"
          d=""
        />

        <!-- 右腕 -->
        <path
          id="rightArm"
          class="skin"
          d=""
        />

        <!-- 左脚 -->
        <path
          id="leftLeg"
          class="skin"
          d=""
        />

        <!-- 右脚 -->
        <path
          id="rightLeg"
          class="skin"
          d=""
        />

        <!-- 柔らかな陰影 -->
        <path
          id="bodyShadow"
          class="shadow"
          d=""
        />

        <!-- 肩〜胸の光 -->
        <path
          id="bodyLight"
          class="skin-light"
          d=""
        />

        <!-- お腹中央の自然な陰影 -->
        <path
          id="bodyDetail"
          class="body-detail"
          d="
            M150 151
            C147 177 147 200 150 225
          "
        />

      </svg>

    </div>

    <div class="body-info">
      入力したサイズに合わせてシルエットが変化します
    </div>

  </section>


  <!-- グラフ -->
  <section class="card">

    <h2>サイズの変化</h2>

    <div class="select-row">
      <select id="graphSelect" onchange="drawGraph()">
        <option value="weight">体重</option>
        <option value="bust">バスト</option>
        <option value="waist">ウエスト</option>
        <option value="hip">ヒップ</option>
        <option value="thigh">太もも</option>
        <option value="calf">ふくらはぎ</option>
        <option value="ankle">足首</option>
        <option value="arm">二の腕</option>
      </select>
    </div>

    <div class="graph-wrap">
      <canvas id="graph"></canvas>
    </div>

  </section>


  <!-- 履歴 -->
  <section class="card">

    <h2>記録履歴</h2>

    <div id="history"></div>

  </section>

</div>


<script>

const STORAGE_KEY = "bodyRecords";

let animationFrame = null;

const defaults = {
  height: 159,
  weight: 47,
  bust: 82,
  waist: 65,
  hip: 90,
  thigh: 50,
  calf: 33,
  ankle: 23,
  arm: 25
};


/* =========================
   日付
========================= */

function todayString() {

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;
}


/* =========================
   初期化
========================= */

document.getElementById("date").value = todayString();

function getRecords() {

  try {

    return JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    ) || [];

  } catch {

    return [];

  }
}


/* =========================
   最新記録
========================= */

function latestRecord() {

  const records = getRecords();

  if (!records.length) {

    return defaults;

  }

  return records
    .sort((a, b) =>
      a.date.localeCompare(b.date)
    )
    [records.length - 1];
}


/* =========================
   数値補助
========================= */

function numberOrDefault(value, fallback) {

  const n = parseFloat(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


/* =========================
   保存
========================= */

function saveRecord() {

  const date =
    document.getElementById("date").value ||
    todayString();

  const record = {

    date,

    height:
      numberOrDefault(
        document.getElementById("height").value,
        defaults.height
      ),

    weight:
      numberOrDefault(
        document.getElementById("weight").value,
        defaults.weight
      ),

    bust:
      numberOrDefault(
        document.getElementById("bust").value,
        defaults.bust
      ),

    waist:
      numberOrDefault(
        document.getElementById("waist").value,
        defaults.waist
      ),

    hip:
      numberOrDefault(
        document.getElementById("hip").value,
        defaults.hip
      ),

    thigh:
      numberOrDefault(
        document.getElementById("thigh").value,
        defaults.thigh
      ),

    calf:
      numberOrDefault(
        document.getElementById("calf").value,
        defaults.calf
      ),

    ankle:
      numberOrDefault(
        document.getElementById("ankle").value,
        defaults.ankle
      ),

    arm:
      numberOrDefault(
        document.getElementById("arm").value,
        defaults.arm
      )
  };

  let records = getRecords();

  const index =
    records.findIndex(
      r => r.date === date
    );

  if (index >= 0) {

    records[index] = record;

  } else {

    records.push(record);

  }

  records.sort(
    (a, b) => a.date.localeCompare(b.date)
  );

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(records)
  );

  document.getElementById("message").textContent =
    "保存しました ✨";

  updateBody(true);
  drawGraph();
  renderHistory();

  setTimeout(() => {

    document.getElementById("message").textContent = "";

  }, 1800);
}


/* =========================
   入力欄に最新値
========================= */

function fillInputs() {

  const r = latestRecord();

  document.getElementById("height").value =
    r.height ?? "";

  document.getElementById("weight").value =
    r.weight ?? "";

  document.getElementById("bust").value =
    r.bust ?? "";

  document.getElementById("waist").value =
    r.waist ?? "";

  document.getElementById("hip").value =
    r.hip ?? "";

  document.getElementById("thigh").value =
    r.thigh ?? "";

  document.getElementById("calf").value =
    r.calf ?? "";

  document.getElementById("ankle").value =
    r.ankle ?? "";

  document.getElementById("arm").value =
    r.arm ?? "";
}


/* =========================
   BODY PARAMETER
========================= */

function bodyParameters(r) {

  const bust =
    numberOrDefault(r.bust, 82);

  const waist =
    numberOrDefault(r.waist, 65);

  const hip =
    numberOrDefault(r.hip, 90);

  const thigh =
    numberOrDefault(r.thigh, 50);

  const calf =
    numberOrDefault(r.calf, 33);

  const ankle =
    numberOrDefault(r.ankle, 23);

  const arm =
    numberOrDefault(r.arm, 25);


  /*
    数値 → SVG上の横幅

    数値の変化が大きすぎないように
    上限・下限を設定
  */

  const bustW =
    Math.max(
      68,
      Math.min(
        116,
        84 + (bust - 82) * 1.05
      )
    );

  const waistW =
    Math.max(
      55,
      Math.min(
        96,
        66 + (waist - 65) * .85
      )
    );

  const hipW =
    Math.max(
      76,
      Math.min(
        126,
        88 + (hip - 90) * 1.0
      )
    );

  const thighW =
    Math.max(
      22,
      Math.min(
        43,
        29 + (thigh - 50) * .55
      )
    );

  const calfW =
    Math.max(
      15,
      Math.min(
        31,
        20 + (calf - 33) * .55
      )
    );

  const ankleW =
    Math.max(
      11,
      Math.min(
        21,
        14 + (ankle - 23) * .45
      )
    );

  const armW =
    Math.max(
      11,
      Math.min(
        22,
        14 + (arm - 25) * .42
      )
    );


  return {
    bustW,
    waistW,
    hipW,
    thighW,
    calfW,
    ankleW,
    armW
  };
}


/* =========================
   BODY SHAPE
========================= */

function bodyPaths(p) {

  const cx = 150;

  const bustL =
    cx - p.bustW / 2;

  const bustR =
    cx + p.bustW / 2;

  const waistL =
    cx - p.waistW / 2;

  const waistR =
    cx + p.waistW / 2;

  const hipL =
    cx - p.hipW / 2;

  const hipR =
    cx + p.hipW / 2;


  /* ---------- 胴体 ---------- */

  const torso = `
    M ${bustL} 88

    C ${bustL-7} 94,
      ${bustL-13} 108,
      ${bustL-11} 124

    C ${bustL-9} 139,
      ${waistL+4} 150,
      ${waistL} 166

    C ${waistL-2} 181,
      ${waistL+3} 196,
      ${waistL-4} 211

    C ${waistL-6} 225,
      ${hipL+2} 240,
      ${hipL+7} 253

    C ${hipL+12} 266,
      ${hipL+20} 274,
      ${cx-19} 280

    L ${cx+19} 280

    C ${hipR-20} 274,
      ${hipR-12} 266,
      ${hipR-7} 253

    C ${hipR-2} 240,
      ${waistR+6} 225,
      ${waistR+4} 211

    C ${waistR-3} 196,
      ${waistR+2} 181,
      ${waistR} 166

    C ${waistR-4} 150,
      ${bustR+9} 139,
      ${bustR+11} 124

    C ${bustR+13} 108,
      ${bustR+7} 94,
      ${bustR} 88

    C ${cx+16} 82,
      ${cx+8} 80,
      ${cx} 82

    C ${cx-8} 80,
      ${cx-16} 82,
      ${bustL} 88

    Z
  `;


  /* ---------- 腕 ---------- */

  const leftArmOuter =
    bustL - 17 - p.armW;

  const rightArmOuter =
    bustR + 17 + p.armW;


  const leftArm = `
    M ${bustL+2} 96

    C ${bustL-9} 100,
      ${bustL-17} 111,
      ${bustL-20} 128

    C ${bustL-24} 149,
      ${leftArmOuter} 178,
      ${leftArmOuter+2} 204

    C ${leftArmOuter+3} 217,
      ${leftArmOuter+1} 230,
      ${leftArmOuter+7} 238

    C ${leftArmOuter+12} 244,
      ${leftArmOuter+19} 241,
      ${leftArmOuter+21} 234

    L ${leftArmOuter+25} 211

    C ${leftArmOuter+28} 187,
      ${bustL+p.armW+6} 151,
      ${bustL+p.armW+8} 126

    C ${bustL+p.armW+10} 112,
      ${bustL+12} 101,
      ${bustL+2} 96

    Z
  `;


  const rightArm = `
    M ${bustR-2} 96

    C ${bustR+9} 100,
      ${bustR+17} 111,
      ${bustR+20} 128

    C ${bustR+24} 149,
      ${rightArmOuter} 178,
      ${rightArmOuter-2} 204

    C ${rightArmOuter-3} 217,
      ${rightArmOuter-1} 230,
      ${rightArmOuter-7} 238

    C ${rightArmOuter-12} 244,
      ${rightArmOuter-19} 241,
      ${rightArmOuter-21} 234

    L ${rightArmOuter-25} 211

    C ${rightArmOuter-28} 187,
      ${bustR-p.armW-6} 151,
      ${bustR-p.armW-8} 126

    C ${bustR-p.armW-10} 112,
      ${bustR-12} 101,
      ${bustR-2} 96

    Z
  `;


  /* ---------- 脚 ---------- */

  const thighL =
    cx - p.thighW - 4;

  const thighR =
    cx + p.thighW + 4;

  const calfL =
    cx - p.calfW / 2 - 4;

  const calfR =
    cx + p.calfW / 2 + 4;

  const ankleL =
    cx - p.ankleW / 2 - 4;

  const ankleR =
    cx + p.ankleW / 2 + 4;


  const leftLeg = `
    M ${cx-19} 276

    C ${thighL+8} 284,
      ${thighL} 304,
      ${thighL+1} 327

    C ${thighL+2} 342,
      ${calfL+7} 350,
      ${calfL+6} 366

    C ${calfL+5} 383,
      ${ankleL+4} 398,
      ${ankleL+3} 416

    L ${ankleL} 443

    C ${ankleL} 448,
      ${ankleL+4} 450,
      ${ankleL+9} 450

    L ${ankleL+ankleW+1} 450

    C ${ankleL+ankleW+4} 447,
      ${ankleL+ankleW+3} 443,
      ${ankleL+ankleW+3} 438

    L ${ankleL+ankleW+4} 415

    C ${ankleL+ankleW+5} 397,
      ${calfL+p.calfW+5} 382,
      ${calfL+p.calfW+4} 364

    C ${calfL+p.calfW+4} 348,
      ${thighL+p.thighW+6} 335,
      ${thighL+p.thighW+5} 318

    C ${thighL+p.thighW+4} 301,
      ${cx-1} 286,
      ${cx-1} 276

    Z
  `;


  const rightLeg = `
    M ${cx+19} 276

    C ${thighR-8} 284,
      ${thighR} 304,
      ${thighR-1} 327

    C ${thighR-2} 342,
      ${calfR-7} 350,
      ${calfR-6} 366

    C ${calfR-5} 383,
      ${ankleR-4} 398,
      ${ankleR-3} 416

    L ${ankleR} 443

    C ${ankleR} 448,
      ${ankleR-4} 450,
      ${ankleR-9} 450

    L ${ankleR-ankleW-1} 450

    C ${ankleR-ankleW-4} 447,
      ${ankleR-ankleW-3} 443,
      ${ankleR-ankleW-3} 438

    L ${ankleR-ankleW-4} 415

    C ${ankleR-ankleW-5} 397,
      ${calfR-p.calfW-5} 382,
      ${calfR-p.calfW-4} 364

    C ${calfR-p.calfW-4} 348,
      ${thighR-p.thighW-6} 335,
      ${thighR-p.thighW-5} 318

    C ${thighR-p.thighW-4} 301,
      ${cx+1} 286,
      ${cx+1} 276

    Z
  `;


  /* ---------- 陰影 ---------- */

  const shadow = `
    M ${bustL+8} 111

    C ${cx-15} 101,
      ${cx-7} 102,
      ${cx-5} 116

    C ${cx-10} 137,
      ${cx-12} 154,
      ${waistL+7} 170

    C ${waistL+5} 187,
      ${waistL+9} 200,
      ${hipL+11} 216

    C ${hipL+15} 231,
      ${hipL+19} 244,
      ${hipL+23} 251

    C ${cx-20} 238,
      ${cx-22} 219,
      ${cx-18} 199

    C ${cx-14} 179,
      ${cx-17} 151,
      ${cx-10} 130

    C ${cx-7} 120,
      ${cx-2} 114,
      ${bustL+8} 111

    Z
  `;


  /* ---------- 光 ---------- */

  const light = `
    M ${cx-7} 101

    C ${cx+5} 98,
      ${bustR-12} 106,
      ${bustR-9} 121

    C ${bustR-7} 134,
      ${cx+13} 143,
      ${cx+11} 159

    C ${cx+9} 175,
      ${cx+7} 190,
      ${cx+10} 205

    C ${cx+12} 218,
      ${cx+10} 229,
      ${cx+5} 238

    C ${cx+2} 225,
      ${cx+3} 208,
      ${cx+4} 192

    C ${cx+5} 173,
      ${cx+4} 151,
      ${cx+1} 133

    C ${cx-2} 119,
      ${cx-4} 109,
      ${cx-7} 101

    Z
  `;


  return {
    torso,
    leftArm,
    rightArm,
    leftLeg,
    rightLeg,
    shadow,
    light
  };
}


/* =========================
   PATH ANIMATION
========================= */

function animateBody(target) {

  if (!animateBody.current) {

    animateBody.current =
      JSON.parse(JSON.stringify(target));

    applyBodyPaths(
      animateBody.current
    );

    return;

  }


  const start =
    animateBody.current;

  const end =
    target;

  const duration = 850;

  const startTime =
    performance.now();


  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

  }


  function frame(now) {

    let t =
      (now - startTime) /
      duration;

    if (t > 1) t = 1;

    /*
      smooth ease
    */
    const eased =
      t * t * (3 - 2 * t);


    const current = {};

    for (const key in end) {

      current[key] =
        interpolatePath(
          start[key],
          end[key],
          eased
        );

    }

    applyBodyPaths(current);


    if (t < 1) {

      animationFrame =
        requestAnimationFrame(frame);

    } else {

      animateBody.current =
        JSON.parse(
          JSON.stringify(end)
        );

    }

  }

  animationFrame =
    requestAnimationFrame(frame);
}


/*
  SVG pathの数値を補間するため、
  同じ形のパターンを使って
  数値だけ変化させる。
*/

function interpolatePath(a, b, t) {

  const aNums =
    a.match(/-?\d+(?:\.\d+)?/g)
      ?.map(Number) || [];

  const bNums =
    b.match(/-?\d+(?:\.\d+)?/g)
      ?.map(Number) || [];


  if (
    aNums.length !== bNums.length
  ) {

    return t < .5 ? a : b;

  }


  let i = 0;

  return b.replace(
    /-?\d+(?:\.\d+)?/g,
    () => {

      const value =
        aNums[i] +
        (bNums[i] - aNums[i]) * t;

      i++;

      return value.toFixed(2);

    }
  );
}


/* =========================
   PATH反映
========================= */

function applyBodyPaths(paths) {

  document
    .getElementById("torso")
    .setAttribute("d", paths.torso);

  document
    .getElementById("leftArm")
    .setAttribute("d", paths.leftArm);

  document
    .getElementById("rightArm")
    .setAttribute("d", paths.rightArm);

  document
    .getElementById("leftLeg")
    .setAttribute("d", paths.leftLeg);

  document
    .getElementById("rightLeg")
    .setAttribute("d", paths.rightLeg);

  document
    .getElementById("bodyShadow")
    .setAttribute("d", paths.shadow);

  document
    .getElementById("bodyLight")
    .setAttribute("d", paths.light);
}


/* =========================
   BODY UPDATE
========================= */

function updateBody(animate = false) {

  const r =
    latestRecord();

  const p =
    bodyParameters(r);

  const paths =
    bodyPaths(p);


  if (animate) {

    animateBody(paths);

  } else {

    animateBody.current =
      JSON.parse(
        JSON.stringify(paths)
      );

    applyBodyPaths(paths);

  }
}


/* =========================
   GRAPH
========================= */

function drawGraph() {

  const canvas =
    document.getElementById("graph");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr, dpr);

  const width =
    rect.width;

  const height =
    rect.height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const records =
    getRecords().sort(
      (a,b) =>
        a.date.localeCompare(b.date)
    );


  if (!records.length) {

    ctx.fillStyle = "#aaa";

    ctx.font = "13px sans-serif";

    ctx.textAlign = "center";

    ctx.fillText(
      "まだ記録がありません",
      width / 2,
      height / 2
    );

    return;
  }


  const key =
    document.getElementById(
      "graphSelect"
    ).value;


  const values =
    records.map(
      r => Number(r[key])
    ).filter(
      Number.isFinite
    );


  if (!values.length) return;


  let min =
    Math.min(...values);

  let max =
    Math.max(...values);


  if (min === max) {

    min -= 1;
    max += 1;

  }


  const padding = {
    left: 42,
    right: 15,
    top: 20,
    bottom: 35
  };


  const graphW =
    width -
    padding.left -
    padding.right;

  const graphH =
    height -
    padding.top -
    padding.bottom;


  /*
    横線
  */

  ctx.strokeStyle = "#eee";

  ctx.lineWidth = 1;

  for (let i = 0; i <= 4; i++) {

    const y =
      padding.top +
      graphH * i / 4;

    ctx.beginPath();

    ctx.moveTo(
      padding.left,
      y
    );

    ctx.lineTo(
      width - padding.right,
      y
    );

    ctx.stroke();


    const label =
      max -
      (max-min) * i / 4;

    ctx.fillStyle = "#999";

    ctx.font = "10px sans-serif";

    ctx.textAlign = "right";

    ctx.fillText(
      label.toFixed(1),
      padding.left - 7,
      y + 3
    );

  }


  /*
    グラフ線
  */

  ctx.beginPath();

  values.forEach(
    (value, i) => {

      const x =
        values.length === 1
          ? padding.left + graphW / 2
          : padding.left +
            graphW *
            i /
            (values.length - 1);

      const y =
        padding.top +
        graphH *
        (max - value) /
        (max - min);


      if (i === 0) {

        ctx.moveTo(x, y);

      } else {

        ctx.lineTo(x, y);

      }

    }
  );


  ctx.strokeStyle = "#9b7768";

  ctx.lineWidth = 2.5;

  ctx.stroke();


  /*
    点
  */

  values.forEach(
    (value, i) => {

      const x =
        values.length === 1
          ? padding.left + graphW / 2
          : padding.left +
            graphW *
            i /
            (values.length - 1);

      const y =
        padding.top +
        graphH *
        (max - value) /
        (max - min);


      ctx.beginPath();

      ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#9b7768";

      ctx.fill();

    }
  );


  /*
    日付
  */

  ctx.fillStyle = "#999";

  ctx.font = "9px sans-serif";

  ctx.textAlign = "center";


  records.forEach(
    (record, i) => {

      if (
        !Number.isFinite(
          Number(record[key])
        )
      ) return;

      const x =
        records.length === 1
          ? padding.left + graphW / 2
          : padding.left +
            graphW *
            i /
            (records.length - 1);

      const label =
        record.date.slice(5)
          .replace("-", "/");

      ctx.fillText(
        label,
        x,
        height - 12
      );

    }
  );
}


/* =========================
   HISTORY
========================= */

function renderHistory() {

  const container =
    document.getElementById(
      "history"
    );

  const records =
    getRecords().sort(
      (a,b) =>
        b.date.localeCompare(a.date)
    );


  if (!records.length) {

    container.innerHTML =
      '<div class="empty">まだ記録がありません</div>';

    return;

  }


  container.innerHTML =
    records.map(
      (r, index) => {

        return `
          <div class="history-item">

            <div>

              <div class="history-date">
                ${r.date}
              </div>

              <div class="history-values">
                体重 ${r.weight ?? "-"}kg
                ／
                W ${r.waist ?? "-"}cm
                ／
                H ${r.hip ?? "-"}cm
              </div>

            </div>

            <button
              class="delete-btn"
              onclick="deleteRecord('${r.date}')"
            >
              削除
            </button>

          </div>
        `;

      }
    ).join("");
}


/* =========================
   DELETE
========================= */

function deleteRecord(date) {

  const ok =
    confirm(
      `${date} の記録を削除しますか？`
    );

  if (!ok) return;


  const records =
    getRecords().filter(
      r => r.date !== date
    );


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(records)
  );


  renderHistory();

  drawGraph();

  updateBody(true);

  fillInputs();
}


/* =========================
   初回表示
========================= */

fillInputs();

updateBody(false);

renderHistory();

drawGraph();


window.addEventListener(
  "resize",
  drawGraph
);

</script>
