<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Body Log">
<title>Body Log</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: #faf8f6;
  color: #444;
}

header {
  padding: 28px 20px 18px;
  text-align: center;
  background: #fff;
  border-bottom: 1px solid #eee;
}

header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: 700;
}

header p {
  margin: 7px 0 0;
  color: #999;
  font-size: 13px;
}

.container {
  width: min(700px, 92%);
  margin: 20px auto 50px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.05);
}

.card h2 {
  margin: 0 0 16px;
  font-size: 18px;
}

.date {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  background: #fff;
  margin-bottom: 15px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.input-group label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
  color: #777;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 11px;
  font-size: 16px;
  outline: none;
}

.input-group input:focus {
  border-color: #bda9a0;
}

.unit {
  font-size: 12px;
  color: #aaa;
  margin-left: 3px;
}

.save-button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #75635c;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.save-button:active {
  transform: scale(0.98);
}

.message {
  text-align: center;
  font-size: 13px;
  color: #8b7b72;
  margin-top: 10px;
  min-height: 18px;
}

/* 2D BODY */

.body-area {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 430px;
  overflow: hidden;
}

.body-svg {
  width: 300px;
  height: 420px;
}

.body-fill {
  fill: #ead8ce;
  stroke: #765f56;
  stroke-width: 2;
}

.body-line {
  fill: none;
  stroke: #765f56;
  stroke-width: 2;
  stroke-linecap: round;
}

.body-info {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-top: -5px;
}

/* GRAPH */

.graph-wrap {
  width: 100%;
  overflow-x: auto;
}

canvas {
  width: 100%;
  height: 280px;
  display: block;
}

.select-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 5px;
  margin-bottom: 10px;
}

.select-row button {
  flex-shrink: 0;
  padding: 8px 13px;
  border: 1px solid #ddd;
  border-radius: 20px;
  background: white;
  color: #777;
}

.select-row button.active {
  background: #75635c;
  color: white;
  border-color: #75635c;
}

/* HISTORY */

.history-item {
  border-bottom: 1px solid #eee;
  padding: 14px 0;
}

.history-item:last-child {
  border-bottom: none;
}

.history-date {
  font-weight: bold;
  margin-bottom: 7px;
}

.history-values {
  font-size: 13px;
  color: #777;
  line-height: 1.8;
}

.delete-button {
  margin-top: 8px;
  border: none;
  background: #f3eeee;
  color: #977;
  padding: 6px 10px;
  border-radius: 8px;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 20px;
  font-size: 14px;
}

@media (max-width: 500px) {
  .grid {
    grid-template-columns: 1fr 1fr;
  }

  .body-svg {
    width: 270px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Body Log</h1>
  <p>からだの変化を、やさしく記録</p>
</header>

<div class="container">

  <!-- INPUT -->
  <section class="card">
    <h2>今日のサイズ</h2>

    <input
      type="date"
      id="date"
      class="date"
    >

    <div class="grid">

      <div class="input-group">
        <label>身長 <span class="unit">cm</span></label>
        <input id="height" type="number" step="0.1">
      </div>

      <div class="input-group">
        <label>体重 <span class="unit">kg</span></label>
        <input id="weight" type="number" step="0.1">
      </div>

      <div class="input-group">
        <label>バスト <span class="unit">cm</span></label>
        <input id="bust" type="number" step="0.1">
      </div>

      <div class="input-group">
        <label>ウエスト <span class="unit">cm</span></label>
        <input id="waist" type="number" step="0.1">
      </div>

      <div class="input-group">
        <label>ヒップ <span class="unit">cm</span></label>
        <input id="hip" type="number" step="0.1">
      </div>

      <div class="input-group">
        <label>太もも <span class="unit">cm</span></label>
        <input id="thigh" type="number" step="0.1">
      </div>

      <div class="input-group">
        <label>ふくらはぎ <span class="unit">cm</span></label>
        <input id="calf" type="number" step="0.1">
      </div>

      <div class="input-group">
        <label>足首 <span class="unit">cm</span></label>
        <input id="ankle" type="number" step="0.1">
      </div>

      <div class="input-group">

        <input id="arm" type="number" step="0.1">
      </div>

    </div>

    <button class="save-button" onclick="saveData()">
      記録する
    </button>

    <div id="message" class="message"></div>
  </section>


  <!-- BODY -->
  <section class="card">
    <h2>現在の体型</h2>

    <div class="body-area">

      <svg
  class="real-body"
  viewBox="0 0 280 440"
  id="bodySvg"
  aria-label="入力したサイズを反映した人体シルエット"
>

  <!-- 頭 -->

    </div>

    <div class="body-info">
      入力したサイズに合わせてイメージが変化します
    </div>
  </section>


  <!-- GRAPH -->
  <section class="card">
    <h2>サイズの変化</h2>

    <div class="select-row">

      <button class="active" onclick="changeGraph('weight', this)">
        体重
      </button>

      <button onclick="changeGraph('bust', this)">
        バスト
      </button>

      <button onclick="changeGraph('waist', this)">
        ウエスト
      </button>

      <button onclick="changeGraph('hip', this)">
        ヒップ
      </button>

      <button onclick="changeGraph('thigh', this)">
        太もも
      </button>

      <button onclick="changeGraph('calf', this)">
        ふくらはぎ
      </button>

      <button onclick="changeGraph('ankle', this)">
        足首
      </button>

      <button onclick="changeGraph('arm', this)">
        二の腕
      </button>

    </div>

    <div class="graph-wrap">
      <canvas id="graph"></canvas>
    </div>

  <!-- HISTORY -->

<script>

const fields = [
  "height",
  "weight",
  "bust",
  "waist",
  "hip",
  "thigh",
  "calf",
  "ankle",
  "arm"
];

let graphTarget = "weight";

let records =
  JSON.parse(localStorage.getItem("bodyRecords") || "[]");


// 今日の日付
const today = new Date();

document.getElementById("date").value =
  today.toISOString().split("T")[0];


// 保存
function saveData() {

  const date =
    document.getElementById("date").value;

  if (!date) {
    showMessage("日付を入力してください");
    return;
  }

  const record = {
    date: date
  };

  fields.forEach(field => {

    const value =
      parseFloat(document.getElementById(field).value);

    record[field] =
      Number.isFinite(value) ? value : null;

  });

  if (
    Object.values(record).every(
      (v, i) => i === 0 || v === null
    )
  ) {
    showMessage("サイズを1つ以上入力してください");
    return;
  }

  // 同じ日付なら上書き
  records =
    records.filter(item => item.date !== date);

  records.push(record);

  records.sort(
    (a,b) => a.date.localeCompare(b.date)
  );

  localStorage.setItem(
    "bodyRecords",
    JSON.stringify(records)
  );

  showMessage("記録しました ✓");

  renderHistory();
  drawGraph();
  updateBody();
}


// メッセージ
function showMessage(text) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  setTimeout(() => {
    message.textContent = "";
  }, 2200);
}


// 最新データ
function latestRecord() {

  if (records.length === 0)
    return null;

  return records[records.length - 1];
}


// 2D体型
function updateBody() {

  const r = latestRecord();

  if (!r) return;

  /*
   * 基準サイズ
   */
  const bust  = r.bust  || 82;
  const waist = r.waist || 65;
  const hip   = r.hip   || 90;
  const thigh = r.thigh || 50;
  const calf  = r.calf  || 33;
  const ankle = r.ankle || 23;
  const arm   = r.arm   || 25;

  /*
   * サイズを人体の幅に変換
   *
   * 基準値からの変化を少しずつ反映。
   * 極端に変形しないよう上限・下限を設定。
   */

  const bustW =
    Math.max(66, Math.min(108, 76 + (bust - 82) * 0.85));

  const waistW =
    Math.max(52, Math.min(92, 62 + (waist - 65) * 0.75));

  const hipW =
    Math.max(70, Math.min(116, 82 + (hip - 90) * 0.85));

  const thighW =
    Math.max(20, Math.min(39, 27 + (thigh - 50) * 0.45));

  const calfW =
    Math.max(13, Math.min(28, 19 + (calf - 33) * 0.45));

  const ankleW =
    Math.max(10, Math.min(20, 14 + (ankle - 23) * 0.35));

  const armW =
    Math.max(10, Math.min(20, 13 + (arm - 25) * 0.35));


  /*
   * 中央
   */
  const cx = 140;


  /*
   * 胴体
   */

  const bustLeft = cx - bustW / 2;
  const bustRight = cx + bustW / 2;

  const waistLeft = cx - waistW / 2;
  const waistRight = cx + waistW / 2;

  const hipLeft = cx - hipW / 2;
  const hipRight = cx + hipW / 2;


  document
    .getElementById("torso")
    .setAttribute(
      "d",
      `
      M ${bustLeft} 80

      C ${bustLeft-5} 90
        ${bustLeft-7} 105
        ${bustLeft-4} 122

      C ${bustLeft-2} 137
        ${waistLeft+2} 151
        ${waistLeft} 168

      C ${waistLeft-1} 184
        ${waistLeft+2} 198
        ${waistLeft-3} 211

      C ${waistLeft-5} 225
        ${hipLeft+2} 242
        ${hipLeft+7} 254

      C ${hipLeft+11} 264
        ${hipLeft+15} 270
        ${hipLeft+20} 276

      L ${cx-17} 276

      L ${cx+17} 276

      C ${hipRight-15} 270
        ${hipRight-11} 264
        ${hipRight-7} 254

      C ${hipRight-2} 242
        ${waistRight+5} 225
        ${waistRight+3} 211

      C ${waistRight-2} 198
        ${waistRight+1} 184
        ${waistRight} 168

      C ${waistRight-2} 151
        ${bustRight+2} 137
        ${bustRight+4} 122

      C ${bustRight+7} 105
        ${bustRight+5} 90
        ${bustRight} 80

      Z
      `
    );


  /*
   * 腕
   */

  const armGap = 8;
  const armTop = bustW / 2 + armGap;

  const leftArmOuter = cx - armTop - armW;

  const rightArmOuter = cx + armTop + armW;


  document
    .getElementById("leftArm")
    .setAttribute(
      "d",
      `
      M ${bustLeft} 99

      C ${bustLeft-10} 103
        ${bustLeft-15} 116
        ${bustLeft-17} 132

      L ${leftArmOuter} 202

      C ${leftArmOuter-2} 215
        ${leftArmOuter+1} 228
        ${leftArmOuter+7} 235

      C ${leftArmOuter+11} 239
        ${leftArmOuter+16} 236
        ${leftArmOuter+17} 230

      L ${leftArmOuter+22} 207

      L ${bustLeft+armW+2} 151

      L ${bustLeft+armW+7} 119

      Z
      `
    );


  document
    .getElementById("rightArm")
    .setAttribute(
      "d",
      `
      M ${bustRight} 99

      C ${bustRight+10} 103
        ${bustRight+15} 116
        ${bustRight+17} 132

      L ${rightArmOuter} 202

      C ${rightArmOuter+2} 215
        ${rightArmOuter-1} 228
        ${rightArmOuter-7} 235

      C ${rightArmOuter-11} 239
        ${rightArmOuter-16} 236
        ${rightArmOuter-17} 230

      L ${rightArmOuter-22} 207

      L ${bustRight-armW-2} 151

      L ${bustRight-armW-7} 119

      Z
      `
    );


  /*
   * 太もも〜脚
   */

  const thighLeftOuter =
    cx - thighW - 3;

  const thighRightOuter =
    cx + thighW + 3;


  const calfLeftOuter =
    cx - calfW / 2 - 3;

  const calfRightOuter =
    cx + calfW / 2 + 3;


  const ankleLeftOuter =
    cx - ankleW / 2 - 3;

  const ankleRightOuter =
    cx + ankleW / 2 + 3;


  /*
   * 左脚
   */

  document
    .getElementById("leftLeg")
    .setAttribute(
      "d",
      `
      M ${cx-17} 260

      C ${thighLeftOuter+8} 270
        ${thighLeftOuter} 300
        ${thighLeftOuter+2} 325

      C ${thighLeftOuter+4} 340
        ${calfLeftOuter+7} 348
        ${calfLeftOuter+5} 365

      C ${calfLeftOuter+3} 380
        ${ankleLeftOuter+4} 395
        ${ankleLeftOuter+2} 414

      L ${ankleLeftOuter} 429

      L ${ankleLeftOuter+ankleW} 429

      L ${ankleLeftOuter+ankleW+3} 412

      C ${ankleLeftOuter+ankleW+4} 394
        ${calfLeftOuter+calfW+4} 378
        ${calfLeftOuter+calfW+3} 360

      C ${calfLeftOuter+calfW+2} 343
        ${thighLeftOuter+thighW+4} 326
        ${thighLeftOuter+thighW+3} 310

      L ${cx-1} 260

      Z
      `
    );


  /*
   * 右脚
   */

  document
    .getElementById("rightLeg")
    .setAttribute(
      "d",
      `
      M ${cx+17} 260

      C ${thighRightOuter-8} 270
        ${thighRightOuter} 300
        ${thighRightOuter-2} 325

      C ${thighRightOuter-4} 340
        ${calfRightOuter-7} 348
        ${calfRightOuter-5} 365

      C ${calfRightOuter-3} 380
        ${ankleRightOuter-4} 395
        ${ankleRightOuter-2} 414

      L ${ankleRightOuter} 429

      L ${ankleRightOuter-ankleW} 429

      L ${ankleRightOuter-ankleW-3} 412

      C ${ankleRightOuter-ankleW-4} 394
        ${calfRightOuter-calfW-4} 378
        ${calfRightOuter-calfW-3} 360

      C ${calfRightOuter-calfW-2} 343
        ${thighRightOuter-thighW-4} 326
        ${thighRightOuter-thighW-3} 310

      L ${cx+1} 260

      Z
      `
    );


  /*
   * 胴体の陰影も体型に合わせる
   */

  document
    .getElementById("bodyShadow")
    .setAttribute(
      "d",
      `
      M ${bustLeft+5} 112
      C ${bustLeft+10} 101
        ${cx-5} 98
        ${cx-2} 108

      C ${cx-7} 127
        ${cx-8} 146
        ${waistLeft+5} 165

      C ${waistLeft+4} 180
        ${waistLeft+7} 195
        ${hipLeft+8} 211

      C ${hipLeft+12} 225
        ${hipLeft+17} 241
        ${hipLeft+20} 250

      C ${cx-20} 238
        ${cx-22} 219
        ${cx-18} 201

      C ${cx-14} 180
        ${cx-17} 151
        ${cx-10} 130

      Z
      `
    );
}


// グラフ変更
function changeGraph(target, button) {

  graphTarget = target;

  document
    .querySelectorAll(".select-row button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  drawGraph();
}


// グラフ
function drawGraph() {

  const canvas =
    document.getElementById("graph");

  const ctx =
    canvas.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    280 * dpr;

  ctx.scale(dpr,dpr);

  const width =
    rect.width;

  const height =
    280;

  ctx.clearRect(0,0,width,height);


  const data =
    records
      .filter(r =>
        r[graphTarget] !== null &&
        r[graphTarget] !== undefined
      );


  if (data.length === 0) {

    ctx.fillStyle = "#aaa";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";

    ctx.fillText(
      "まだ記録がありません",
      width / 2,
      height / 2
    );

    return;
  }


  const values =
    data.map(r => r[graphTarget]);

  let min =
    Math.min(...values);

  let max =
    Math.max(...values);

  if (min === max) {
    min -= 1;
    max += 1;
  }

  const padding = 42;

  const graphWidth =
    width - padding * 2;

  const graphHeight =
    height - 65;


  // 背景グリッド

  ctx.strokeStyle = "#eee";
  ctx.lineWidth = 1;

  for (let i=0; i<=4; i++) {

    const y =
      20 + graphHeight * i / 4;

    ctx.beginPath();

    ctx.moveTo(padding,y);
    ctx.lineTo(width-padding,y);

    ctx.stroke();

    const value =
      max - (max-min) * i/4;

    ctx.fillStyle = "#aaa";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";

    ctx.fillText(
      value.toFixed(1),
      padding-7,
      y+4
    );
  }


  // 線

  ctx.beginPath();

  data.forEach((r,i) => {

    const x =
      data.length === 1
      ? width/2
      : padding +
        graphWidth *
        i/(data.length-1);

    const y =
      20 +
      graphHeight *
      (max-r[graphTarget]) /
      (max-min);

    if (i === 0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);
  });

  ctx.strokeStyle = "#75635c";
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  ctx.stroke();


  // 点

  data.forEach((r,i) => {

    const x =
      data.length === 1
      ? width/2
      : padding +
        graphWidth *
        i/(data.length-1);

    const y =
      20 +
      graphHeight *
      (max-r[graphTarget]) /
      (max-min);

    ctx.beginPath();

    ctx.arc(
      x,y,5,0,Math.PI*2
    );

    ctx.fillStyle = "#75635c";
    ctx.fill();


    // 日付
    ctx.fillStyle = "#999";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";

    const date =
      r.date.slice(5).replace("-","/");

    ctx.fillText(
      date,
      x,
      height-15
    );
  });
}


// 履歴
function renderHistory() {

  const container =
    document.getElementById("history");

  if (records.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだ記録がありません
      </div>`;

    return;
  }


  container.innerHTML =
    records
      .slice()
      .reverse()
      .map((r,index) => {

        const values = [];

        if (r.height != null)
          values.push(`身長 ${r.height}cm`);

        if (r.weight != null)
          values.push(`体重 ${r.weight}kg`);

        if (r.bust != null)
          values.push(`バスト ${r.bust}cm`);

        if (r.waist != null)
          values.push(`ウエスト ${r.waist}cm`);

        if (r.hip != null)
          values.push(`ヒップ ${r.hip}cm`);

        if (r.thigh != null)
          values.push(`太もも ${r.thigh}cm`);

        if (r.calf != null)
          values.push(`ふくらはぎ ${r.calf}cm`);

        if (r.ankle != null)
          values.push(`足首 ${r.ankle}cm`);

        if (r.arm != null)
          values.push(`二の腕 ${r.arm}cm`);


        return `
          <div class="history-item">

            <div class="history-date">
              ${r.date}
            </div>

            <div class="history-values">
              ${values.join(" ／ ")}
            </div>

            <button
              class="delete-button"
              onclick="deleteRecord('${r.date}')"
            >
              この記録を削除
            </button>

          </div>
        `;

      })
      .join("");
}


// 削除
function deleteRecord(date) {

  if (
    !confirm(
      "この日の記録を削除しますか？"
    )
  ) {
    return;
  }

  records =
    records.filter(
      r => r.date !== date
    );

  localStorage.setItem(
    "bodyRecords",
    JSON.stringify(records)
  );

  renderHistory();
  drawGraph();
  updateBody();
}


// 初期表示
renderHistory();
drawGraph();
updateBody();


// 画面サイズ変更
window.addEventListener(
  "resize",
  drawGraph
);

</script>

</body>
</html>
